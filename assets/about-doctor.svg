<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f6f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1810;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="400" fill="url(#aboutBg)"/>
  
  <!-- Professional figure silhouette -->
  <g transform="translate(250, 200)">
    <!-- Head -->
    <ellipse cx="0" cy="-120" rx="40" ry="50" fill="#d4af37" opacity="0.8"/>
    
    <!-- Body -->
    <rect x="-50" y="-70" width="100" height="120" rx="20" fill="#d4af37" opacity="0.6"/>
    
    <!-- Arms -->
    <ellipse cx="-70" cy="-20" rx="20" ry="60" fill="#d4af37" opacity="0.6"/>
    <ellipse cx="70" cy="-20" rx="20" ry="60" fill="#d4af37" opacity="0.6"/>
    
    <!-- Books/Scrolls -->
    <rect x="-90" y="60" width="20" height="40" rx="2" fill="#8b4513" opacity="0.8"/>
    <rect x="-65" y="65" width="20" height="40" rx="2" fill="#8b4513" opacity="0.8"/>
    <rect x="45" y="60" width="20" height="40" rx="2" fill="#8b4513" opacity="0.8"/>
    <rect x="70" y="65" width="20" height="40" rx="2" fill="#8b4513" opacity="0.8"/>
    
    <!-- Spiritual symbols around -->
    <g opacity="0.4">
      <circle cx="-150" cy="-100" r="15" fill="#d4af37"/>
      <polygon points="150,-100 155,-110 160,-100 170,-105 160,-95 155,-85 150,-95 140,-105" fill="#d4af37"/>
      <circle cx="-180" cy="0" r="12" fill="#d4af37"/>
      <polygon points="180,0 185,-10 190,0 200,-5 190,5 185,15 180,5 170,-5" fill="#d4af37"/>
    </g>
  </g>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="480" height="380" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <rect x="20" y="20" width="460" height="360" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
</svg>