<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  
  <!-- Spiritual symbols -->
  <g transform="translate(200, 200)">
    <!-- Om symbol simplified -->
    <path d="M-60,-20 Q-40,-50 0,-40 Q40,-50 60,-20 Q60,0 40,20 Q0,30 -40,20 Q-60,0 -60,-20 Z" 
          fill="#d4af37" opacity="0.8"/>
    
    <!-- Stars -->
    <g fill="#d4af37" opacity="0.6">
      <polygon points="-80,-80 -75,-90 -70,-80 -60,-85 -70,-75 -75,-65 -80,-75 -90,-85" />
      <polygon points="80,-60 85,-70 90,-60 100,-65 90,-55 85,-45 80,-55 70,-65" />
      <polygon points="-90,60 -85,50 -80,60 -70,55 -80,65 -85,75 -90,65 -100,55" />
      <polygon points="70,80 75,70 80,80 90,75 80,85 75,95 70,85 60,75" />
    </g>
    
    <!-- Decorative border -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Text overlay -->
  <text x="200" y="350" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#d4af37">
    Dr. Sri Patnaik Narahyan
  </text>
  <text x="200" y="375" text-anchor="middle" font-family="serif" font-size="16" fill="#d4af37" opacity="0.8">
    Dual PhD in Vastu &amp; Astrology
  </text>
</svg>